<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login – DSA Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="config.js"></script>
</head>
<body>
<div class="noise"></div>
<div class="grid-bg"></div>
<div id="navContainer"></div>
<div class="flash-container" id="flashContainer"></div>

<main class="main-content">
<div class="auth-wrap">
  <div class="auth-form-side">
    <div class="auth-card">
      <div class="auth-logo-wrap">
        <span class="auth-logo-icon">👑</span>
        <div><h1 class="auth-title">Admin<span>Access</span></h1>
          <p class="auth-sub">Restricted — admins only</p></div>
      </div>
      <div class="info-banner danger-banner">
        <span>🔐</span>
        <span>This portal is for administrators only. Unauthorized access is logged.</span>
      </div>
      <form class="auth-form" id="adminLoginForm">
        <div class="form-group">
          <label class="form-label">Admin Username</label>
          <input class="form-input" type="text" name="username" placeholder="admin_handle" required>
        </div>
        <div class="form-group">
          <label class="form-label">Admin Password</label>
          <div class="input-wrap">
            <input class="form-input" type="password" name="password" id="apw" placeholder="••••••••" required>
            <button type="button" class="pwd-toggle" onclick="togglePwd('apw',this)">👁</button>
          </div>
        </div>
        <button type="submit" class="btn btn-accent btn-full btn-lg">Enter Admin Panel →</button>
      </form>
      <p class="auth-footer"><a href="login.html">← Back to User Login</a></p>
    </div>
  </div>
  <div class="auth-deco-side admin-deco-side">
    <div class="auth-deco-content">
      <div class="admin-deco-icon">👑</div>
      <div class="deco-tagline">Admin Panel<br><span style="font-size:.9rem;color:var(--dim)">Full control</span></div>
    </div>
  </div>
</div>
</main>

<script src="assets/js/main.js"></script>
<script src="assets/js/app.js"></script>
<script>
(async () => {
  const me = await apiGet("/api/auth/me");
  if (me.authenticated && me.is_admin) {
    window.location.href = "admin.html";
    return;
  }
  showQueuedMessages();
})();

document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const data = await apiPostJSON("/admin/login", {
    username: fd.get("username"),
    password: fd.get("password")
  });
  if (data.success) {
    queueFlash("success", data.message);
    window.location.href = data.redirect || "admin.html";
  } else {
    showToast(data.message || "Invalid admin credentials.", "error");
  }
});
</script>
</body>
</html>
