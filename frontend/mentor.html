<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mentor Mode – DSA Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="config.js"></script>
<style>
.mentor-layout{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.5rem}
@media(max-width:768px){.mentor-layout{grid-template-columns:1fr}}
.progress-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.75rem;margin-bottom:1.5rem}
.progress-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem 1rem}
.progress-card .pc-name{font-weight:700;font-size:.9rem;margin-bottom:.5rem}
.progress-bar-wrap{height:8px;background:var(--bg3);border-radius:99px;overflow:hidden;margin:.4rem 0}
.progress-bar-fill{height:100%;border-radius:99px;transition:width .4s ease}
.fill-green{background:#34d399} .fill-yellow{background:#fbbf24} .fill-red{background:#f87171}
.pc-meta{font-size:.74rem;color:var(--muted);display:flex;justify-content:space-between}
.pc-pct{font-family:var(--mono);font-weight:700;font-size:.9rem}
.status-overdue{background:rgba(239,68,68,.15);color:#f87171}
.row-completed td{opacity:.65}
.row-completed .problem-link{text-decoration:line-through;color:var(--muted)}
.feedback-form{margin-top:.5rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:flex-start}
.feedback-form textarea{flex:1;min-width:200px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius);padding:.4rem .6rem;font-size:.8rem;resize:vertical;font-family:inherit}
.star-rating{display:flex;gap:.2rem;cursor:pointer}
.star-rating span{font-size:1.1rem;opacity:.35;transition:opacity .15s}
.star-rating span.active{opacity:1}
.mentor-tabs{display:flex;gap:.4rem;margin-bottom:1.1rem;flex-wrap:wrap}
.mentor-tab-panel{display:none}
.mentor-tab-panel.active{display:block}
.search-problem-form{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:1rem}
.search-problem-form .form-group{flex:1;min-width:200px;margin:0}
.solved-yes{color:#34d399;font-weight:700}
.solved-no{color:#f87171;font-weight:700}
.search-summary{font-size:.8rem;color:var(--muted);margin-bottom:.75rem}
.search-summary-card{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem 1.1rem;margin-top:.5rem}
.search-summary-count{font-size:.95rem}
#searchRefreshBtn.spinning{animation:spin .8s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="noise"></div>
<div class="grid-bg"></div>
<div id="navContainer"></div>
<div class="flash-container" id="flashContainer"></div>

<main class="main-content" id="app">Loading…</main>

<script src="assets/js/main.js"></script>
<script src="assets/js/app.js"></script>
<script>
const platformCls = p => (p || "").toLowerCase().replace("leetcode", "lc").replace("codeforces", "cf").replace("atcoder", "ac");

// PHASE 2: every mentor request is scoped to one year at a time. Read it
// from the URL (?year=2028) so switching years is just a link/reload,
// same pattern as switching tabs elsewhere in the app.
let CURRENT_YEAR = new URLSearchParams(location.search).get("year") || "";
function withYear(path) {
  if (!CURRENT_YEAR) return path;
  const sep = path.includes("?") ? "&" : "?";
  return `${path}${sep}year=${encodeURIComponent(CURRENT_YEAR)}`;
}
function switchYear(y) {
  const url = new URL(location.href);
  url.searchParams.set("year", y);
  location.href = url.toString();
}
async function addYearSheet() {
  const year = document.getElementById("newYearInput").value.trim();
  const sid = document.getElementById("newYearSheetId").value.trim();
  if (!year || !sid) { showToast("Enter both a year and a spreadsheet ID.", "error"); return; }
  const d = await apiPostForm("/admin/year_sheets", { year, spreadsheet_id: sid });
  showToast(d.message || (d.success ? "Saved!" : "Failed"), d.success ? "success" : "error");
  if (d.success) switchYear(year);
}

function fillForm(name, url, diff, topic) {
  document.getElementById("f_name").value = name;
  document.getElementById("f_url").value = url;
  document.getElementById("f_diff").value = diff;
  document.getElementById("f_topic").value = topic;
  document.getElementById("f_name").scrollIntoView({ behavior: "smooth" });
}
function toggleFeedback(id) {
  const r = document.getElementById("fb-" + id);
  r.style.display = r.style.display === "none" ? "" : "none";
}
function setRating(id, val) {
  document.getElementById("rating-" + id).value = val;
  document.querySelectorAll("#stars-" + id + " span").forEach((s, i) => s.classList.toggle("active", i < val));
}

document.addEventListener("submit", async (e) => {
  if (e.target.id === "assignForm") {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target).entries());
    fd.year = CURRENT_YEAR;
    const d = await apiPostForm("/admin/mentor", fd);
    showToast(d.message || (d.success ? "Assigned!" : "Failed"), d.success ? "success" : "error");
    if (d.success) location.reload();
  }
  if (e.target.id === "customProbForm") {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target).entries());
    const d = await apiPostForm("/admin/custom_problem", fd);
    showToast(d.message || (d.success ? "Created!" : "Failed"), d.success ? "success" : "error");
    if (d.success) location.reload();
  }
  if (e.target.classList.contains("feedbackForm")) {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target).entries());
    const d = await apiPostForm("/add_mentor_feedback", fd);
    showToast(d.message || "Feedback sent.", d.success !== false ? "success" : "error");
  }
});

async function assignToAll() {
  const form = document.getElementById("assignForm");
  const fd = Object.fromEntries(new FormData(form).entries());
  const pname = fd.problem_name || "";
  if (!pname.trim()) { showToast("Enter a problem name first.", "error"); return; }
  if (!confirm(`Assign "${pname}" to ALL students?`)) return;
  fd.assign_all = "1";
  fd.user_id = "0";
  fd.year = CURRENT_YEAR;
  const d = await apiPostForm("/admin/mentor", fd);
  showToast(d.message || (d.success ? "Done!" : "Failed"), d.success ? "success" : "error");
  if (d.success) location.reload();
}

async function refreshAssignmentStatuses() {
  const d = await apiPostJSON(withYear("/admin/mentor/refresh_status"), {});
  showToast(d.message || "Refreshed.", d.success ? "success" : "error");
  if (d.success) location.reload();
}

function switchMentorTab(tab) {
  document.querySelectorAll(".mentor-tab-panel").forEach(p => p.classList.toggle("active", p.id === "tab-" + tab));
  document.querySelectorAll(".mentor-tabs .filter-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
}

// ── State ───────────────────────────────────────────────────────────────
const PER_PAGE = 8;
let MENTOR_DATA = null;
let progressPage = 1;
let assignPage = 1;
let searchResults = null;
let searchPage = 1;

function goProgressPage(p) { progressPage = p; renderProgressGrid(); }
function goAssignPage(p) { assignPage = p; renderAssignmentsTable(); }
function goSearchPage(p) { searchPage = p; renderSearchResults(); }

function renderProgressGrid() {
  const el = document.getElementById("progressGridWrap");
  if (!el) return;
  const { users, user_progress } = MENTOR_DATA;
  if (!users || !users.length) { el.innerHTML = `<div class="empty-state" style="padding:1.5rem;text-align:center">No students yet.</div>`; return; }
  const { items, page, total_pages } = paginateArray(users, progressPage, 12);
  el.innerHTML = `
    <div class="progress-grid">
      ${items.map(u => {
        const p = user_progress[u.id] || {};
        const pct = p.pct || 0;
        const fillCls = pct >= 70 ? "fill-green" : pct >= 30 ? "fill-yellow" : "fill-red";
        return `<div class="progress-card">
          <div class="pc-name">${u.username}</div>
          <div class="progress-bar-wrap"><div class="progress-bar-fill ${fillCls}" style="width:${pct}%"></div></div>
          <div class="pc-meta"><span>${p.done || 0}/${p.total || 0} done</span><span class="pc-pct">${pct}%</span></div>
        </div>`;
      }).join("")}
    </div>
    ${paginationHTML(page, total_pages, "goProgressPage")}`;
}

function renderAssignmentsTable() {
  const el = document.getElementById("assignTableWrap");
  if (!el) return;
  const { assignments } = MENTOR_DATA;
  const today = new Date().toISOString().slice(0, 10);
  const { items, page, total_pages } = paginateArray(assignments, assignPage, PER_PAGE);
  el.innerHTML = `
    <table>
      <thead><tr><th>Student</th><th>Problem</th><th>Platform</th><th>Difficulty</th><th>Topic</th><th>Due</th><th>Progress</th><th>Status</th><th>Action</th></tr></thead>
      <tbody>
        ${items.length ? items.map(a => {
          const isCompleted = a.completed == 1 || a.completed === true;
          const overdue = !isCompleted && a.due_date && a.due_date < today;
          const statusBadge = isCompleted
            ? `<span class="status-badge status-active">✅ Completed</span>`
            : overdue
              ? `<span class="status-badge status-overdue">🔴 Overdue</span>`
              : `<span class="status-badge status-pending">🟡 Pending</span>`;
          return `<tr class="${isCompleted ? 'row-completed' : ''}">
            <td class="mono">${a.username}</td>
            <td class="problem-name">${a.problem_url ? `<a href="${a.problem_url}" target="_blank" class="problem-link">${a.problem_name} ↗</a>` : a.problem_name}</td>
            <td><span class="platform-badge platform-${platformCls(a.platform)}">${a.platform}</span></td>
            <td><span class="diff-badge diff-${(a.difficulty || "").toLowerCase()}">${a.difficulty}</span></td>
            <td><span class="tag-pill">${a.topic || "—"}</span></td>
            <td class="mono small">${a.due_date || "—"}</td>
            <td><div class="progress-bar-wrap" style="min-width:80px"><div class="progress-bar-fill ${isCompleted ? "fill-green" : overdue ? "fill-red" : "fill-yellow"}" style="width:${isCompleted ? "100" : "0"}%"></div></div></td>
            <td>${statusBadge}</td>
            <td><button class="btn-sm btn-outline" onclick="toggleFeedback(${a.id})">💬 Feedback</button></td>
          </tr>
          <tr id="fb-${a.id}" style="display:none">
            <td colspan="9" style="padding:.75rem 1rem;background:rgba(255,255,255,.02)">
              <form class="feedbackForm">
                <input type="hidden" name="assignment_id" value="${a.id}">
                <input type="hidden" name="user_id" value="${a.user_id}">
                <textarea name="feedback" rows="2" placeholder="Write feedback for ${a.username}..."></textarea>
                <div style="display:flex;flex-direction:column;gap:.5rem">
                  <div class="star-rating" id="stars-${a.id}">${[1,2,3,4,5].map(i => `<span onclick="setRating(${a.id},${i})">⭐</span>`).join("")}</div>
                  <input type="hidden" name="rating" id="rating-${a.id}" value="0">
                  <button type="submit" class="btn-sm btn-primary">Send</button>
                </div>
              </form>
            </td>
          </tr>`;
        }).join("") : `<tr><td colspan="9" class="empty-state" style="padding:2rem;text-align:center">No assignments yet.</td></tr>`}
      </tbody>
    </table>
    ${paginationHTML(page, total_pages, "goAssignPage")}`;
}

async function runProblemSearch(e) {
  if (e) e.preventDefault();
  const pname = document.getElementById("sp_name").value.trim();
  const purl = document.getElementById("sp_url").value.trim();
  if (!pname && !purl) { showToast("Enter a problem name or URL to search.", "error"); return; }
  const d = await apiGet(withYear(`/admin/mentor/search_problem?problem_name=${encodeURIComponent(pname)}&problem_url=${encodeURIComponent(purl)}`));
  if (!d.success) { showToast(d.message || "Search failed.", "error"); return; }
  searchResults = d;
  lastSearch = { pname, purl };
  renderSearchResults();
}

async function removeRegnColumn() {
  const btn = document.getElementById("removeRegnBtn");
  btn.disabled = true;
  btn.textContent = "Removing...";
  try {
    const d = await apiPostJSON(withYear("/admin/mentor/remove_regn_column"), {});
    showToast(d.removed ? "Regn Num column removed from the sheet." : (d.success ? "Already removed — nothing to do." : (d.error || "Failed.")), d.success ? "success" : "error");
  } catch (e) {
    showToast("Failed — network or server error.", "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "🗑️ Remove Regn Num Column";
  }
}

let lastSearch = null; // { pname, purl } — so the refresh icon can re-run the same search

async function refreshSearchResult() {
  if (!lastSearch) return;
  const btn = document.getElementById("searchRefreshBtn");
  if (btn) { btn.disabled = true; btn.classList.add("spinning"); }
  try {
    const d = await apiGet(withYear(`/admin/mentor/search_problem?problem_name=${encodeURIComponent(lastSearch.pname)}&problem_url=${encodeURIComponent(lastSearch.purl)}`));
    if (!d.success) { showToast(d.message || "Refresh failed.", "error"); return; }
    searchResults = d;
    renderSearchResults();
    showToast("Refreshed — synced to sheet.", "success");
  } catch (e) {
    showToast("Refresh failed — network or server error.", "error");
  } finally {
    if (btn) { btn.disabled = false; btn.classList.remove("spinning"); }
  }
}

function renderSearchResults() {
  const el = document.getElementById("searchResultsWrap");
  if (!el) return;
  if (!searchResults) { el.innerHTML = ""; return; }
  const { total, solved_count } = searchResults;
  el.innerHTML = `
    <div class="search-summary-card">
      <div class="search-summary-count">
        <span class="solved-yes" style="font-size:1.4rem">${solved_count}</span>
        <span class="muted"> / ${total} students solved this problem</span>
      </div>
      <button type="button" id="searchRefreshBtn" class="btn-sm btn-outline" onclick="refreshSearchResult()" title="Re-check submissions for this problem and re-sync the sheet">
        🔄 Refresh
      </button>
    </div>`;
}

(async () => {
  const me = await requireAuth({ admin: true });
  if (!me) return;

  const yearData = await apiGet("/admin/year_sheets");
  const yearSheets = (yearData && yearData.year_sheets) || [];
  const configuredYears = yearSheets.map(y => y.year);

  const yearManagerHTML = `
    <div class="settings-card" style="margin-bottom:1.25rem">
      <div class="settings-section">
        <h3>📅 Year / Cohort Sheets</h3>
        <p class="section-desc">Each year has its own separate Google Sheet. Add a new year here, or pick an existing one below to manage it.</p>
        <div style="display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:.75rem">
          <div class="form-group" style="margin:0"><label class="form-label">Year</label>
            <input class="form-input" id="newYearInput" placeholder="e.g. 2028" style="width:140px"></div>
          <div class="form-group" style="margin:0;flex:1;min-width:220px"><label class="form-label">Spreadsheet ID or Sheet URL</label>
            <input class="form-input mono" id="newYearSheetId" placeholder="1AbC...xyz or full Google Sheets link"></div>
          <button type="button" class="btn btn-primary" onclick="addYearSheet()">Save</button>
        </div>
      </div>
    </div>`;

  if (!configuredYears.length) {
    document.getElementById("app").innerHTML = `
      <div class="page-header"><div><h2>🎓 Mentor Mode</h2><p class="page-sub">No years configured yet</p></div></div>
      ${yearManagerHTML}
      <p class="muted">Add a year and its spreadsheet ID above to get started — students can't sign up until at least one year exists.</p>`;
    return;
  }

  if (!CURRENT_YEAR || !configuredYears.includes(CURRENT_YEAR)) {
    CURRENT_YEAR = configuredYears[0];
  }

  const yearSelectorHTML = `
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center">
      <span class="form-label" style="margin:0">Year:</span>
      ${configuredYears.map(y => `<button type="button" class="filter-tab ${y === CURRENT_YEAR ? 'active' : ''}" onclick="switchYear('${y}')">${y}</button>`).join("")}
      <button type="button" class="btn-sm btn-outline" onclick="switchMentorTab('years')" style="margin-left:auto">⚙️ Manage Years</button>
    </div>`;

  MENTOR_DATA = await apiGet(withYear("/admin/mentor"));
  const { users, custom_probs, user_progress } = MENTOR_DATA;

  const studentOptions = (users || []).map(u => {
    const p = user_progress[u.id] || {};
    return `<option value="${u.id}">${u.username} (${p.pct || 0}% done)</option>`;
  }).join("");

  const quickAssign = (custom_probs && custom_probs.length) ? `
    <div style="margin-top:1.25rem">
      <h4 class="form-label" style="margin-bottom:.6rem">⚡ Quick Assign</h4>
      <div class="custom-prob-grid">
        ${custom_probs.map(cp => `
          <div class="custom-prob-card" onclick="switchMentorTab('assign');fillForm('${(cp.title || "").replace(/'/g, "\\'")}','${(cp.url || "").replace(/'/g, "\\'")}','${cp.difficulty}','${(cp.topic || "").replace(/'/g, "\\'")}')">
            <div class="cp-name">${cp.title}</div>
            <div class="cp-meta">
              <span class="diff-badge diff-${(cp.difficulty || "").toLowerCase()}">${cp.difficulty}</span>
              <span class="tag-pill">${cp.topic}</span>
            </div>
          </div>`).join("")}
      </div>
    </div>` : "";

  document.getElementById("app").innerHTML = `
  <div class="page-header">
    <div><h2>🎓 Mentor Mode <span class="card-tag" style="vertical-align:middle">Batch ${CURRENT_YEAR}</span></h2><p class="page-sub">Assign problems · Track progress · Give feedback — everything below is scoped to ${CURRENT_YEAR} only</p></div>
    <a href="admin.html" class="btn btn-outline">← Admin Panel</a>
  </div>

  ${yearSelectorHTML}

  <div class="table-card" style="padding:1.1rem 1.1rem 0">
    <div class="card-header" style="margin-bottom:.6rem"><h3>📈 Student Progress — ${CURRENT_YEAR}</h3><span class="card-tag">${(users || []).length} students</span></div>
    <div id="progressGridWrap"></div>
  </div>

  <div class="mentor-tabs" style="margin-top:1.25rem">
    <button type="button" class="filter-tab active" data-tab="assign" onclick="switchMentorTab('assign')">📌 Assign Problem</button>
    <button type="button" class="filter-tab" data-tab="create" onclick="switchMentorTab('create')">🧩 Create Problem</button>
    <button type="button" class="filter-tab" data-tab="search" onclick="switchMentorTab('search')">🔍 Search Problem</button>
    <button type="button" class="filter-tab" data-tab="years" onclick="switchMentorTab('years')">📅 Years</button>
  </div>

  <div id="tab-years" class="mentor-tab-panel">
    ${yearManagerHTML}
    <div class="table-card" style="padding:1.1rem">
      <h3 style="margin-bottom:.6rem">Configured years</h3>
      <div class="table-wrap"><table><thead><tr><th>Year</th><th>Spreadsheet ID</th><th>Updated</th></tr></thead>
      <tbody>${yearSheets.map(y => `<tr><td class="mono">${y.year}</td><td class="mono small">${y.spreadsheet_id}</td><td class="small muted">${y.updated_at || '—'}</td></tr>`).join("")}</tbody></table></div>
    </div>
  </div>


  <div id="tab-assign" class="mentor-tab-panel active">
    <div class="settings-card">
      <div class="settings-section">
        <h3>📌 Assign Problem <span class="card-tag">${CURRENT_YEAR}</span></h3>
        <p class="section-desc">Assign a problem to a student with optional deadline. Only ${CURRENT_YEAR} students are listed below — switch batch with the Year buttons above to assign to a different year.</p>
        <form id="assignForm">
          <input type="hidden" name="year" value="${CURRENT_YEAR}">
          <div class="form-group">
            <label class="form-label">Student</label>
            <select class="form-input" name="user_id" required>
              <option value="">— Select Student —</option>
              ${studentOptions}
            </select>
          </div>
          <div class="form-group"><label class="form-label">Problem Name</label>
            <input class="form-input" type="text" name="problem_name" id="f_name" placeholder="e.g. Two Sum" required maxlength="200"></div>
          <div class="form-group"><label class="form-label">Problem URL</label>
            <input class="form-input mono" type="url" name="problem_url" id="f_url" placeholder="https://leetcode.com/problems/..." maxlength="300"></div>
          <div class="form-grid-2">
            <div class="form-group"><label class="form-label">Difficulty</label>
              <select class="form-input" name="difficulty" id="f_diff"><option>Easy</option><option selected>Medium</option><option>Hard</option></select></div>
            <div class="form-group"><label class="form-label">Platform</label>
              <select class="form-input" name="platform"><option>LeetCode</option><option>Codeforces</option><option>AtCoder</option><option>Custom</option></select></div>
            <div class="form-group"><label class="form-label">Topic</label>
              <input class="form-input" type="text" name="topic" id="f_topic" placeholder="e.g. Dynamic Programming" maxlength="64"></div>
            <div class="form-group"><label class="form-label">Due Date <span class="form-hint">(optional)</span></label>
              <input class="form-input" type="date" name="due_date"></div>
          </div>
          <div class="form-group"><label class="form-label">Note to Student</label>
            <textarea class="form-input" name="note" rows="2" placeholder="Hints or instructions..." maxlength="500"></textarea></div>
          <div style="display:flex;gap:.6rem;margin-top:.5rem;flex-wrap:wrap">
            <button type="submit" class="btn btn-primary">Assign Problem →</button>
            <button type="button" class="btn btn-outline" onclick="assignToAll()" title="Assign this problem to all students at once">
              👥 Assign to All Students
            </button>
          </div>
        </form>
        ${quickAssign}
      </div>
    </div>
  </div>

  <div id="tab-create" class="mentor-tab-panel">
    <div class="settings-card">
      <div class="settings-section">
        <h3>🧩 Create Custom Problem</h3>
        <p class="section-desc">Create a problem you can assign to any student in any batch (not year-specific — it's just a reusable template).</p>
        <form id="customProbForm">
          <div class="form-group"><label class="form-label">Title</label>
            <input class="form-input" type="text" name="title" placeholder="Problem title" required maxlength="200"></div>
          <div class="form-group"><label class="form-label">Description</label>
            <textarea class="form-input" name="description" rows="3" maxlength="2000" placeholder="Problem statement..."></textarea></div>
          <div class="form-grid-2">
            <div class="form-group"><label class="form-label">Difficulty</label>
              <select class="form-input" name="difficulty"><option>Easy</option><option selected>Medium</option><option>Hard</option></select></div>
            <div class="form-group"><label class="form-label">Topic</label>
              <input class="form-input" type="text" name="topic" placeholder="e.g. Arrays" maxlength="64"></div>
          </div>
          <div class="form-group"><label class="form-label">URL <span class="form-hint">(optional)</span></label>
            <input class="form-input mono" type="url" name="url" placeholder="https://..." maxlength="300"></div>
          <button type="submit" class="btn btn-outline" style="margin-top:.5rem">Create Problem</button>
        </form>
      </div>
    </div>
  </div>

  <div id="tab-search" class="mentor-tab-panel">
    <div class="settings-card">
      <div class="settings-section">
        <h3>🔍 Search Problem <span class="card-tag">${CURRENT_YEAR}</span></h3>
        <p class="section-desc">Search among ${CURRENT_YEAR} students for a problem and see who's solved it — student name, register number, problem name, problem link and Solved (Yes/No), one row per student. Switch batch with the Year buttons above to search a different year.</p>
        <form class="search-problem-form" onsubmit="runProblemSearch(event)">
          <div class="form-group"><label class="form-label">Problem Name</label>
            <input class="form-input" type="text" id="sp_name" placeholder="e.g. Two Sum" maxlength="200"></div>
          <div class="form-group"><label class="form-label">Problem URL <span class="form-hint">(optional)</span></label>
            <input class="form-input mono" type="text" id="sp_url" placeholder="https://leetcode.com/problems/..." maxlength="300"></div>
          <button type="submit" class="btn btn-primary">Search →</button>
        </form>
        <div id="searchResultsWrap"></div>
      </div>
    </div>
  </div>

  <div class="table-card" style="margin-top:1rem">
    <div class="card-header" style="flex-wrap:wrap;gap:.5rem">
      <div style="display:flex;align-items:center;gap:.6rem">
        <h3>📋 All Assignments <span class="card-tag">${CURRENT_YEAR}</span></h3>
        <span class="count-pill">${(MENTOR_DATA.assignments || []).length}</span>
      </div>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap">
        <button class="btn-sm btn-outline" onclick="refreshAssignmentStatuses()" title="Re-check submissions and update Completed status">
          🔄 Refresh Status
        </button>
        <button id="removeRegnBtn" class="btn-sm btn-outline" onclick="removeRegnColumn()" title="One-time cleanup: deletes the old Regn Num column from the roster sheet">
          🗑️ Remove Regn Num Column
        </button>
      </div>
    </div>
    <div id="assignTableWrap" class="table-wrap"></div>
  </div>`;

  renderProgressGrid();
  renderAssignmentsTable();
})();
</script>
</body>
</html>
