<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Contest – DSA Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="config.js"></script>
<style>
  .form-card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:1.5rem;box-shadow:var(--shadow);max-width:560px;margin:0 auto}
  .form-card h3{margin:0 0 .3rem}
  .form-card p.hint{margin:0 0 1.2rem;color:var(--muted);font-size:.85rem}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
  .form-grid .full{grid-column:1/-1}
  .form-grid label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.06em}
  .form-grid input,.form-grid select{width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:.65rem .8rem;border-radius:12px;font-family:inherit;font-size:.9rem}
  .form-actions{margin-top:1.3rem;display:flex;gap:.6rem;flex-wrap:wrap}
  @media(max-width:520px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="noise"></div>
<div class="grid-bg"></div>
<div id="navContainer"></div>
<div class="flash-container" id="flashContainer"></div>

<main class="main-content" id="app">
  <div class="page-header">
    <div>
      <h2>+ Create Contest</h2>
      <p class="page-sub">This creates the contest record only — Google Sheet sync and result sync come in later phases.</p>
    </div>
    <a href="contest_dashboard.html" class="btn btn-outline">← Student Contest</a>
  </div>

  <div class="form-card">
    <form id="createContestForm">
      <div class="form-grid">
        <div class="full">
          <label>Contest Name</label>
          <input type="text" name="contest_name" placeholder="Weekly Contest 452" required maxlength="120">
        </div>
        <div>
          <label>Contest Code</label>
          <input type="text" name="contest_code" placeholder="LC452" required maxlength="32">
        </div>
        <div>
          <label>Platform</label>
          <select name="platform" required>
            <option value="Codeforces">Codeforces</option>
            <option value="AtCoder">AtCoder</option>
            <option value="LeetCode">LeetCode</option>
          </select>
        </div>
        <div>
          <label>Contest Date</label>
          <input type="date" name="contest_date" required>
        </div>
        <div></div>
        <div>
          <label>Start Time</label>
          <input type="time" name="start_time" required>
        </div>
        <div>
          <label>End Time</label>
          <input type="time" name="end_time" required>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="createBtn">Create Contest</button>
        <a href="contest_dashboard.html" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</main>

<script src="assets/js/main.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.getElementById("createContestForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("createBtn");
  btn.disabled = true;
  const form = new FormData(e.target);
  const data = Object.fromEntries(form.entries());
  try {
    const d = await apiPostForm("/contest/create", data);
    if (d.success) {
      queueFlash("success", d.message || "Contest created.");
      window.location.href = "contest_dashboard.html";
    } else {
      showToast(d.message || "Failed to create contest.", "error");
      btn.disabled = false;
    }
  } catch (err) {
    showToast("Network error — try again", "error");
    btn.disabled = false;
  }
});

(async () => {
  const me = await requireAuth({ admin: true });
  if (!me) return;
})();
</script>
</body>
</html>
