<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management – DSA Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="config.js"></script>
<style>
  .section-card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:1rem;box-shadow:var(--shadow)}
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th,td{padding:.5rem .6rem;border-bottom:1px solid var(--border2);text-align:left;vertical-align:middle}
  th{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  td input{width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:.4rem .55rem;border-radius:8px;font-size:.85rem;font-family:inherit}
  tr.missing{background:rgba(251,191,36,.05)}
  .badge{display:inline-flex;padding:.15rem .5rem;border-radius:999px;font-size:.72rem;background:rgba(251,191,36,.15);color:#fbbf24}
  .banner{margin-bottom:1rem}
</style>
</head>
<body>
<div class="noise"></div>
<div class="grid-bg"></div>
<div id="navContainer"></div>
<div class="flash-container" id="flashContainer"></div>

<main class="main-content" id="app">Loading…</main>

<script src="assets/js/main.js"></script>
<script src="assets/js/app.js"></script>
<script>
async function saveStudent(uid) {
  const row = document.getElementById(`row-${uid}`);
  const data = {
    full_name: row.querySelector('[name="full_name"]').value,
    reg_no: row.querySelector('[name="reg_no"]').value,
    roll_no: row.querySelector('[name="roll_no"]').value,
    branch: row.querySelector('[name="branch"]').value,
  };
  const d = await apiPostForm(`/admin/students/update/${uid}`, data);
  showToast(d.message || (d.success ? "Saved!" : "Failed"), d.success ? "success" : "error");
  if (d.success) location.reload();
}

(async () => {
  const me = await requireAuth({ admin: true });
  if (!me) return;

  const { users, missing_count } = await apiGet("/admin/students");

  document.getElementById("app").innerHTML = `
  <div class="page-header">
    <div>
      <h2>🧾 Student Management</h2>
      <p class="page-sub">Backfill Reg No / Roll No / Branch for existing students — required before the Student_Contest sheet can list them properly.</p>
    </div>
    <a href="contest_dashboard.html" class="btn btn-outline">← Student Contest</a>
  </div>

  ${missing_count ? `
  <div class="info-banner banner">
    <span>⚠</span>
    <span>${missing_count} student(s) still missing a Reg No. They'll be skipped when the Student_Contest sheet is generated until filled in.</span>
  </div>` : ""}

  <div class="section-card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Username</th><th>Full Name</th><th>Reg No</th><th>Roll No</th><th>Branch</th><th></th></tr></thead>
        <tbody>
          ${(users || []).map(u => `
            <tr class="${!u.reg_no ? "missing" : ""}" id="row-${u.id}">
              <td>${u.username} ${!u.reg_no ? `<span class="badge">missing</span>` : ""}</td>
              <td><input type="text" name="full_name" value="${u.full_name || ""}" maxlength="120" placeholder="Full name"></td>
              <td><input type="text" name="reg_no" value="${u.reg_no || ""}" maxlength="40" placeholder="Reg No"></td>
              <td><input type="text" name="roll_no" value="${u.roll_no || ""}" maxlength="40" placeholder="Roll No"></td>
              <td><input type="text" name="branch" value="${u.branch || ""}" maxlength="40" placeholder="Branch"></td>
              <td><button type="button" class="btn btn-outline btn-sm" onclick="saveStudent(${u.id})">Save</button></td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>
  </div>`;
})();
</script>
</body>
</html>
