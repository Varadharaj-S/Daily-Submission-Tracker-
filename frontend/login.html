<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – DSA Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="config.js"></script>
</head>
<body>
<div class="noise"></div>
<div class="grid-bg"></div>

<div id="navContainer"></div>
<div class="flash-container" id="flashContainer"></div>

<main class="main-content">
<div class="auth-wrap">
  <div class="auth-form-side">
    <div class="auth-card">
      <div class="auth-logo-wrap">
        <span class="auth-logo-icon">⚡</span>
        <div><h1 class="auth-title">DSA<span>Tracker</span></h1>
          <p class="auth-sub">Your competitive programming HQ</p></div>
      </div>
      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-input" type="text" name="username" placeholder="your_handle" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrap">
            <input class="form-input" type="password" name="password" id="pw1" placeholder="••••••••" required>
            <button type="button" class="pwd-toggle" onclick="togglePwd('pw1',this)">👁</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg">Login →</button>
      </form>
      <p class="auth-footer">No account? <a href="signup.html">Sign up</a></p>
    </div>
  </div>
  <div class="auth-deco-side">
    <div class="auth-deco-content">
      <div class="deco-platforms">
        <div class="deco-plat cf-deco"><span>CF</span><p>Codeforces</p></div>
        <div class="deco-plat lc-deco"><span>LC</span><p>LeetCode</p></div>
        <div class="deco-plat ac-deco"><span>AC</span><p>AtCoder</p></div>
      </div>
      <div class="deco-tagline">One dashboard.<br>All platforms.</div>
    </div>
  </div>
</div>
</main>

<script src="assets/js/main.js"></script>
<script src="assets/js/app.js"></script>
<script>
(async () => {
  // Already logged in? Same behavior as the old login() view redirecting
  // an authenticated user straight through.
  const me = await apiGet("/api/auth/me");
  if (me.authenticated) {
    window.location.href = me.is_admin ? "admin.html" : "dashboard.html";
    return;
  }
  showQueuedMessages();
})();

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const data = await apiPostJSON("/login", {
    username: fd.get("username"),
    password: fd.get("password")
  });
  if (data.success) {
    queueFlash("success", data.message);
    window.location.href = data.redirect || "dashboard.html";
  } else {
    showToast(data.message || "Login failed.", "error");
  }
});
</script>
</body>
</html>
