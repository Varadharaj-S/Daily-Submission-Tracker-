<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Contest – DSA Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="config.js"></script>
<style>
  .contest-wrap{display:flex;flex-direction:column;gap:1rem}
  .contest-hero{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-start}
  .contest-hero h2{margin:0;font-size:1.5rem}
  .contest-hero p{margin:.35rem 0 0;color:var(--muted)}
  .grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem}
  .mini-card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:1rem;box-shadow:var(--shadow)}
  .mini-card .k{font-size:.75rem;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}
  .mini-card .v{font-size:1.6rem;font-weight:800;margin-top:.35rem}
  .section-card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:1rem;box-shadow:var(--shadow)}
  .section-card h3{margin:0 0 .9rem;font-size:1rem}
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th,td{padding:.55rem .7rem;border-bottom:1px solid var(--border2);text-align:left;vertical-align:top}
  th{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
  td{font-size:.88rem}
  .chip{display:inline-flex;align-items:center;padding:.18rem .55rem;border-radius:999px;background:var(--bg3);border:1px solid var(--border2);font-size:.78rem}
  .chip.status-upcoming{background:rgba(251,191,36,.12);color:#fbbf24}
  .chip.status-running{background:rgba(16,185,129,.12);color:#34d399}
  .chip.status-completed{background:rgba(148,163,184,.12);color:#94a3b8}
  .chip.sync-ok{background:rgba(16,185,129,.12);color:#34d399}
  .chip.sync-error{background:rgba(248,113,113,.12);color:#f87171}
  .chip.sync-pending{background:rgba(148,163,184,.12);color:#94a3b8}
  .sync-cell{display:flex;flex-direction:column;gap:.3rem;min-width:150px}
  .sync-cell small{color:var(--muted);font-size:.72rem}
  .row-actions{display:flex;gap:.4rem;flex-wrap:wrap}
  .empty-state{text-align:center;padding:2.5rem 1rem;color:var(--muted)}
</style>
</head>
<body>
<div class="noise"></div>
<div class="grid-bg"></div>
<div id="navContainer"></div>
<div class="flash-container" id="flashContainer"></div>

<main class="main-content" id="app">Loading…</main>

<script src="assets/js/main.js"></script>
<script src="assets/js/app.js"></script>
<script>
let CONTESTS_DATA;

function renderContestDashboard() {
  const { contests, counts, total_contests } = CONTESTS_DATA;
  const app = document.getElementById("app");

  app.innerHTML = `
  <div class="contest-wrap">

    <div class="contest-hero">
      <div>
        <h2>⭐ Student Contest</h2>
        <p>Track contest participation across Codeforces, LeetCode, and AtCoder.</p>
      </div>
      <div class="row-actions">
        <a href="contest_create.html" class="btn btn-primary">+ Create Contest</a>
        <a href="contest_history.html" class="btn btn-outline">📜 History</a>
        <button type="button" class="btn btn-outline" id="refreshSheetBtn" onclick="refreshSheet()">🔄 Refresh Sheet</button>
      </div>
    </div>

    <div class="grid-4">
      <div class="mini-card"><div class="k">Total Contests</div><div class="v">${total_contests}</div></div>
      <div class="mini-card"><div class="k">Upcoming</div><div class="v">${counts["Upcoming"] || 0}</div></div>
      <div class="mini-card"><div class="k">Running</div><div class="v">${counts["Running"] || 0}</div></div>
      <div class="mini-card"><div class="k">Completed</div><div class="v">${counts["Completed"] || 0}</div></div>
    </div>

    <div class="section-card">
      <h3>All Contests</h3>
      ${(contests && contests.length) ? `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Contest</th><th>Code</th><th>Platform</th><th>Date</th>
              <th>Start</th><th>End</th><th>Status</th><th>Sync</th><th></th>
            </tr>
          </thead>
          <tbody>
            ${contests.map(c => `
            <tr>
              <td>${c.contest_name}</td>
              <td><code>${c.contest_code}</code></td>
              <td>${c.platform}</td>
              <td>${c.contest_date}</td>
              <td>${c.start_time}</td>
              <td>${c.end_time}</td>
              <td><span class="chip status-${(c.status || "").toLowerCase()}">${c.status}</span></td>
              <td>${syncCell(c)}</td>
              <td>
                <div class="row-actions">
                  <button type="button" class="btn btn-outline btn-sm" onclick="manageProblems(${c.id}, '${(c.contest_name || "").replace(/'/g, "\\'")}')">📋 Problems</button>
                  ${c.status === "Completed" ? `<button type="button" class="btn btn-outline btn-sm" onclick="syncNow(${c.id}, this)">🔄 Sync Now</button>` : ""}
                  <button type="button" class="btn btn-outline btn-sm" onclick="deleteContest(${c.id}, '${(c.contest_name || "").replace(/'/g, "\\'")}')">🗑 Delete</button>
                </div>
              </td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>` : `
      <div class="empty-state">
        No contests yet. <a href="contest_create.html">Create your first contest</a>.
      </div>`}
    </div>

  </div>`;
}

function syncCell(c) {
  if (c.status !== "Completed") {
    return `<div class="sync-cell"><span class="chip sync-pending">— not due yet</span></div>`;
  }
  if (c.synced) {
    const when = c.last_synced_at ? new Date(c.last_synced_at).toLocaleString() : "";
    return `<div class="sync-cell"><span class="chip sync-ok">✅ Synced</span><small>${when}</small></div>`;
  }
  if (c.last_sync_error) {
    return `<div class="sync-cell"><span class="chip sync-error">⚠️ Failed</span><small title="${c.last_sync_error.replace(/"/g, "&quot;")}">${c.last_sync_error.slice(0, 60)}${c.last_sync_error.length > 60 ? "…" : ""}</small></div>`;
  }
  return `<div class="sync-cell"><span class="chip sync-pending">⏳ Not synced yet</span><small>Click Sync Now</small></div>`;
}

async function loadContestDashboard() {
  CONTESTS_DATA = await apiGet("/student_contest");
  renderContestDashboard();
}

async function deleteContest(cid, name) {
  if (!confirm(`Delete ${name}? This also removes any saved results.`)) return;
  const d = await apiPostForm(`/contest/delete/${cid}`, {});
  showToast(d.message || (d.success ? "Deleted" : "Failed"), d.success ? "success" : "error");
  if (d.success) await loadContestDashboard();
}

async function manageProblems(cid, name) {
  const d = await apiGet(`/contest/problems/${cid}`);
  const list = d.problems || [];
  const current = list.length ? list.map(p => p.problem_id).join(", ") : "(none yet)";
  const input = prompt(
    `Problems for "${name}"\nCurrent: ${current}\n\n` +
    `Grading checks a student's already-synced submissions against these problem IDs/codes ` +
    `during the contest's time window — add every problem before syncing.\n\n` +
    `Type a problem ID/code to ADD it, or "remove:<code>" to remove one, then OK.`
  );
  if (!input) return;
  const trimmed = input.trim();
  let d2;
  if (trimmed.toLowerCase().startsWith("remove:")) {
    d2 = await apiPostForm(`/contest/problems/${cid}/remove`, { problem_id: trimmed.slice(7).trim() });
  } else {
    d2 = await apiPostForm(`/contest/problems/${cid}/add`, { problem_id: trimmed });
  }
  showToast(d2.message || (d2.success ? "Updated" : "Failed"), d2.success ? "success" : "error");
  if (d2.success) await loadContestDashboard();
}

async function syncNow(cid, btn) {
  if (btn) btn.disabled = true;
  try {
    const d = await apiPostForm(`/contest/sync_now/${cid}`, {});
    showToast(d.message || (d.success ? "Synced" : "Sync failed"), d.success ? "success" : "error");
    await loadContestDashboard();
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function refreshSheet() {
  const btn = document.getElementById("refreshSheetBtn");
  if (btn) btn.disabled = true;
  try {
    const d = await apiPostForm("/contest/refresh_sheet", {});
    showToast(d.message || (d.success ? "Refreshed" : "Failed"), d.success ? "success" : "error");
  } finally {
    if (btn) btn.disabled = false;
  }
}

(async () => {
  const me = await requireAuth({ admin: true });
  if (!me) return;
  await loadContestDashboard();
})();
</script>
</body>
</html>
