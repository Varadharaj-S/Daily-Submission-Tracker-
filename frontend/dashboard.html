<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard – DSA Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  .workflow-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.9rem;margin-bottom:1rem}
  .workflow-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1rem .9rem;box-shadow:var(--shadow)}
  .workflow-head{display:flex;align-items:center;gap:.7rem;margin-bottom:.6rem}
  .workflow-head h3{font-size:1rem;font-weight:800;letter-spacing:-.03em}
  .workflow-step{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:.85rem;background:var(--bg3);border:1px solid var(--border2);color:var(--accent)}
  .workflow-card p{color:var(--muted);font-size:.85rem;line-height:1.55}
  .workflow-meta{margin-top:.8rem;display:flex;align-items:center;gap:.65rem;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;padding:.26rem .6rem;border-radius:999px;font-size:.74rem;font-weight:700;background:var(--bg3);border:1px solid var(--border2);color:var(--text)}
  .workflow-import{border-top:2px solid var(--accent)}
  .workflow-auto{border-top:2px solid var(--cf)}
  .workflow-sync{border-top:2px solid var(--success)}
  .workflow-dashboard{border-top:2px solid #8b5cf6}
  .sync-settings{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin:0 0 1.1rem;padding:.9rem 1rem;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg)}
  .sync-settings label{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
  .sync-settings input[type="time"]{background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius);padding:.52rem .75rem;font-family:var(--mono)}
</style>
</head>
<body>
<div class="noise"></div>
<div class="grid-bg"></div>
<div id="navContainer"></div>
<div class="flash-container" id="flashContainer"></div>

<main class="main-content" id="app">Loading…</main>

<script src="assets/js/main.js"></script>
<script src="assets/js/app.js"></script>
<script>
const platformCls = p => (p || "").toLowerCase().replace("codeforces", "cf").replace("leetcode", "lc").replace("atcoder", "ac");
let DASH;

/* ── Import LC — ONE button, THREE independent backend requests ────────
   The UI exposes a single "Import LC" button. Under the hood it awaits
   three separate single-purpose endpoints in strict order — CF, then
   AtCoder, then LeetCode — each its own real HTTP request/response, no
   combined backend request and no /status polling:

     POST /import_codeforces  (one shot)
     POST /import_atcoder     (one shot)
     POST /import_leetcode    (one chunk; auto-repeated by main.js's
                                importLC() while has_more:true, using the
                                offset already persisted server-side —
                                never restarts at 0, never a setInterval)

   This is what replaced the old combined /import_lc (CF+AtCoder+LC in
   one request), which could exceed the deployed Vercel function's
   execution limit and 504 on a first-time LeetCode import. See
   routes/sync.py / sync/chunked_import.py and main.js's importLC().
──────────────────────────────────────────────────────────────────── */

async function sendFeedback() {
  const txt = document.getElementById("feedbackText").value;
  if (!txt.trim()) { showToast("Enter some feedback first", "error"); return; }
  const btn = document.querySelector(".feedback-card button") || document.querySelector("[onclick='sendFeedback()']");
  if (btn) btn.disabled = true;
  try {
    const data = await apiPostJSON("/feedback", { feedback: txt });
    if (data.success) {
      showToast("Feedback sent ✅ Thank you!", "success");
      document.getElementById("feedbackText").value = "";
    } else {
      showToast(data.message || "Failed to send feedback", "error");
    }
  } catch (err) {
    showToast("Network error — try again", "error");
  } finally {
    if (btn) btn.disabled = false;
  }
}

function renderDashboard() {
  const { user, data, challenges, mentor_tasks, sheet_url } = DASH;

  const app = document.getElementById("app");
  app.innerHTML = `
  <div class="page-header">
    <div>
      <h2>Dashboard</h2>
      <p class="page-sub">
        Welcome back, <strong>${user.username}</strong>
        ${user.last_sync ? ` · Last sync: <span class="mono">${user.last_sync}</span>` : ""}
      </p>
    </div>
    <div class="header-actions">
      <button id="syncBtn" class="btn btn-primary" onclick="triggerSync()">
        <span id="syncLabel">⚡ Sync Now</span>
        <span id="syncSpinner" class="spinner" style="display:none"></span>
      </button>
      <button id="importLcBtn" class="btn btn-import" onclick="importLC()">
        <span id="importLcLabel">📥 Import LC${user.lc_import_offset ? " (resume)" : ""}</span>
        <span id="importLcSpinner" class="spinner" style="display:none"></span>
      </button>
      <div id="importStatus" style="display:none;margin-top:.6rem;font-size:.85rem;color:#94a3b8;line-height:1.5;max-width:340px;"></div>
      ${user.lc_imported ? `
        <div class="feedback-card">
          <h3>⭐ Feedback</h3>
          <textarea id="feedbackText" rows="4" placeholder="Tell us about your experience..." class="form-input"></textarea>
          <button onclick="sendFeedback()" class="btn btn-primary">Send Feedback</button>
        </div>` : ""}
      ${sheet_url ? `<a href="${sheet_url}" target="_blank" class="btn btn-outline">📊 Open Sheet</a>` : ""}
      <a href="#" onclick="openMySheet();return false;" class="btn btn-outline" title="Open your tab in the shared Google Sheet">📄 My Sheet</a>
      <a href="daily_tracker.html" class="btn btn-outline">📘 Daily Tracker</a>
      <a href="${BASE_API_URL}/export_csv" class="btn btn-outline">↓ Export CSV</a>
      <a href="profile.html?username=${encodeURIComponent(user.username)}" class="btn btn-outline">🔗 Profile</a>
    </div>
  </div>

  ${user.cookie_expiry ? `
  <div style="background:#7f1d1d;border:1px solid #ef4444;border-radius:12px;padding:14px 18px;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem">
    <div style="display:flex;align-items:center;gap:.7rem">
      <span style="font-size:1.3rem">⚠️</span>
      <div>
        <strong style="color:#fca5a5">LeetCode session expired</strong>
        <p style="margin:.2rem 0 0;font-size:.82rem;color:#fecaca">Your LeetCode cookie is no longer valid. Click the DSA Tracker extension and reconnect to resume automatic sync.</p>
      </div>
    </div>
    <a href="https://leetcode.com" target="_blank" style="white-space:nowrap;background:#ef4444;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:.82rem;font-weight:700;cursor:pointer;text-decoration:none">Open LeetCode →</a>
  </div>` : ""}

  <div class="info-banner">
    <strong>Flow:</strong>
    <span>Import LC runs once → Auto Sync updates daily → Sync Now runs instantly → Dashboard shows the latest totals.</span>
  </div>

  <div class="workflow-grid">
    <div class="workflow-card workflow-import">
      <div class="workflow-head"><span class="workflow-step">1</span><h3>Import</h3></div>
      <p>Three separate one-click imports — Codeforces, AtCoder, and LeetCode (in resumable chunks for a first-time full history import). Each updates the database and your sheet.</p>
      <div class="workflow-meta"><span class="pill">${user.lc_imported ? "LeetCode: Done" : (user.lc_import_offset ? "LeetCode: In progress" : "LeetCode: Pending")}</span></div>
    </div>
    <div class="workflow-card workflow-auto">
      <div class="workflow-head"><span class="workflow-step">2</span><h3>Auto Sync</h3></div>
      <p>Daily background sync for LeetCode, Codeforces, and AtCoder. Public fetch is used for normal syncs.</p>
      <div class="workflow-meta">
        <label class="toggle-label">
          <input type="checkbox" id="autoSyncToggle" ${user.auto_sync_enabled ? "checked" : ""} onchange="toggleAutoSync()">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span>Enabled</span>
        </label>
        <span class="pill">Time: ${user.sync_time || "09:00"}</span>
      </div>
    </div>
    <div class="workflow-card workflow-sync">
      <div class="workflow-head"><span class="workflow-step">3</span><h3>Sync Now</h3></div>
      <p>Manual refresh using the same incremental fetch flow as auto sync. Handy when you want an instant update.</p>
      <div class="workflow-meta"><span class="pill">Manual</span></div>
    </div>
    <div class="workflow-card workflow-dashboard">
      <div class="workflow-head"><span class="workflow-step">4</span><h3>Dashboard</h3></div>
      <p>Track LeetCode, Codeforces, AtCoder, total solved count, streak, topics, and recent activity in one place.</p>
      <div class="workflow-meta"><span class="pill">Live cards</span></div>
    </div>
  </div>

  <div id="syncStatus" class="sync-status" style="display:none"></div>

  <div class="sync-settings">
    <label>⏰ Auto Sync Time</label>
    <input type="time" id="syncTime" value="${user.sync_time || "09:00"}">
    <button onclick="saveSyncTime()" class="btn btn-outline">Save</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card stat-total"><div class="stat-icon">🏆</div><div class="stat-body"><div class="stat-num" data-target="${data.total}">0</div><div class="stat-label">Total Solved</div></div></div>
    <div class="stat-card stat-cf"><div class="stat-icon">🔵</div><div class="stat-body"><div class="stat-num" data-target="${data.cf}">0</div><div class="stat-label">Codeforces</div></div></div>
    <div class="stat-card stat-lc"><div class="stat-icon">🟡</div><div class="stat-body"><div class="stat-num" data-target="${data.lc}">0</div><div class="stat-label">LeetCode</div></div></div>
    <div class="stat-card stat-ac"><div class="stat-icon">🟢</div><div class="stat-body"><div class="stat-num" data-target="${data.ac}">0</div><div class="stat-label">AtCoder</div></div></div>
    <div class="stat-card stat-streak"><div class="stat-icon">🔥</div><div class="stat-body"><div class="stat-num" data-target="${data.streak}">0</div><div class="stat-label">Day Streak</div></div></div>
    <div class="stat-card stat-social"><div class="stat-body"><div class="social-row"><span><strong class="stat-num-sm">${data.follower_count}</strong><br><span class="stat-label">Followers</span></span><span class="social-div"></span><span><strong class="stat-num-sm">${data.following_count}</strong><br><span class="stat-label">Following</span></span></div></div></div>
  </div>

  ${data.total > 0 ? `
  <div class="breakdown-card">
    ${[["CF", data.cf, "cf"], ["LC", data.lc, "lc"], ["AC", data.ac, "ac"]].map(([plat, cnt, cls]) => {
      const pct = data.total ? Math.floor(cnt / data.total * 100) : 0;
      return `<div class="breakdown-row-item">
        <span class="platform-badge platform-${cls}">${plat}</span>
        <div class="breakdown-bar-outer"><div class="breakdown-fill ${cls}-fill" style="width:${pct}%"></div></div>
        <span class="breakdown-pct">${pct}%</span>
        <span class="breakdown-num">${cnt}</span>
      </div>`;
    }).join("")}
  </div>` : ""}

  ${(mentor_tasks && mentor_tasks.length) ? (() => {
    const _today = new Date().toISOString().slice(0, 10);
    const completedTasks = mentor_tasks.filter(t => t.completed == 1 || t.completed === true);
    const overdueTasks   = mentor_tasks.filter(t => !(t.completed == 1 || t.completed === true) && t.due_date && t.due_date < _today);
    const pendingTasks   = mentor_tasks.filter(t => !(t.completed == 1 || t.completed === true) && !(t.due_date && t.due_date < _today));
    const actionable     = [...overdueTasks, ...pendingTasks]; // show overdue first
    if (!actionable.length && !completedTasks.length) return "";
    const borderColor = overdueTasks.length ? "#f87171" : completedTasks.length === mentor_tasks.length ? "#34d399" : "#fbbf24";
    return `
  <div class="table-card" style="padding:1rem;margin-bottom:1rem;border-left:3px solid ${borderColor}">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem">
      <h3 style="margin:0;font-size:.9rem">📋 My Mentor Tasks</h3>
      <span style="font-size:.78rem;color:var(--muted)">
        ${[
          pendingTasks.length   ? `${pendingTasks.length} pending`    : "",
          overdueTasks.length   ? `${overdueTasks.length} overdue`    : "",
          completedTasks.length ? `${completedTasks.length} completed` : "",
        ].filter(Boolean).join(" · ")}
        · <a href="#mentor-section" style="color:var(--accent)">View all</a>
      </span>
    </div>
    ${actionable.slice(0, 3).map(t => {
      const _over = t.due_date && t.due_date < _today;
      return `
      <div style="display:flex;align-items:center;gap:.75rem;padding:.4rem 0;border-bottom:1px solid rgba(255,255,255,.05)">
        <span class="diff-badge diff-${(t.difficulty || "").toLowerCase()}" style="flex-shrink:0">${t.difficulty}</span>
        <span style="flex:1;font-size:.83rem;font-weight:600">
          ${t.problem_url ? `<a href="${t.problem_url}" target="_blank" style="color:var(--text)">${t.problem_name}</a>` : t.problem_name}
        </span>
        ${_over
          ? `<span style="font-size:.7rem;color:#f87171;font-family:var(--mono)">🔴 ${t.due_date}</span>`
          : t.due_date ? `<span style="font-size:.74rem;color:var(--muted);font-family:var(--mono)">Due ${t.due_date}</span>` : ""}
        <span class="status-badge" style="font-size:.68rem;padding:.1rem .4rem;${_over ? 'background:rgba(248,113,113,.15);color:#f87171' : 'background:rgba(251,191,36,.1);color:#fbbf24'}">${_over ? "🔴 Overdue" : "🟡 Pending"}</span>
      </div>`;
    }).join("")}
    ${actionable.length === 0 ? `<div style="font-size:.83rem;color:#34d399;text-align:center;padding:.4rem 0">🎉 All tasks completed!</div>` : ""}
  </div>`;
  })() : ""}

  <div id="mentor-section"></div>
  <div class="table-card">
    <div class="card-header">
      <h3>🎯 Daily Challenges</h3>
      <span class="card-tag">personalized · ${(challenges || []).filter(c => c.completed).length}/${(challenges || []).length} done</span>
    </div>
    <div class="challenges-list">
      ${(challenges && challenges.length) ? challenges.map(c => `
        <div class="challenge-item ${c.completed ? "challenge-done" : ""}" id="ch-${c.id}">
          <div class="challenge-check">
            ${c.completed ? `<span class="check-done">✓</span>` : `<button class="check-btn" onclick="completeChallenge(${c.id})">○</button>`}
          </div>
          <div class="challenge-body">
            <a href="${c.problem_url}" target="_blank" class="challenge-name">${c.problem_name} ↗</a>
            <div class="challenge-meta">
              <span class="platform-badge platform-${platformCls(c.platform)}">${c.platform}</span>
              <span class="diff-badge diff-${(c.difficulty || "").toLowerCase()}">${c.difficulty}</span>
              <span class="tag-pill">${c.topic}</span>
            </div>
          </div>
        </div>`).join("") : `<div class="empty-state">No challenges today. Sync your account first.</div>`}
    </div>
  </div>

  <div class="table-card">
    <div class="card-header">
      <h3>🎓 Mentor Assignments</h3>
      <span class="card-tag">
        ${(() => {
          const today = new Date().toISOString().slice(0, 10);
          const completed = (mentor_tasks || []).filter(t => t.completed == 1 || t.completed === true).length;
          const overdue   = (mentor_tasks || []).filter(t => !(t.completed == 1 || t.completed === true) && t.due_date && t.due_date < today).length;
          const pending   = (mentor_tasks || []).length - completed - overdue;
          return [
            pending   > 0 ? `${pending} pending`   : "",
            overdue   > 0 ? `${overdue} overdue`   : "",
            completed > 0 ? `${completed} completed` : "",
          ].filter(Boolean).join(" · ") || "none";
        })()}
      </span>
    </div>
    <div class="challenges-list">
      ${(mentor_tasks && mentor_tasks.length) ? mentor_tasks.map(t => {
        const today = new Date().toISOString().slice(0, 10);
        const isCompleted = t.completed == 1 || t.completed === true;
        const isOverdue   = !isCompleted && t.due_date && t.due_date < today;

        /* ── COMPLETED ─────────────────────────────────────────────── */
        if (isCompleted) {
          return `<div class="challenge-item challenge-done" id="mt-${t.id}" style="opacity:.65">
            <div class="challenge-check"><span class="check-done" title="Already solved">✓</span></div>
            <div class="challenge-body" style="flex:1">
              ${t.problem_url
                ? `<a href="${t.problem_url}" target="_blank" class="challenge-name" style="text-decoration:line-through;color:var(--muted)">${t.problem_name} ↗</a>`
                : `<span class="challenge-name" style="text-decoration:line-through;color:var(--muted)">${t.problem_name}</span>`}
              <div class="challenge-meta">
                <span class="diff-badge diff-${(t.difficulty || "").toLowerCase()}">${t.difficulty}</span>
                ${t.topic ? `<span class="tag-pill">${t.topic}</span>` : ""}
                <span class="status-badge status-active" style="font-size:.68rem;padding:.1rem .45rem">✅ Completed</span>
              </div>
              ${t.note ? `<p class="mentor-note" style="opacity:.6">📝 ${t.note}</p>` : ""}
            </div>
          </div>`;
        }

        /* ── OVERDUE ───────────────────────────────────────────────── */
        if (isOverdue) {
          return `<div class="challenge-item challenge-overdue" id="mt-${t.id}">
            <div class="challenge-check">
              <button class="check-btn" onclick="completeMentor(${t.id})" title="Mark as solved" style="border-color:#f87171;color:#f87171">○</button>
            </div>
            <div class="challenge-body" style="flex:1">
              ${t.problem_url
                ? `<a href="${t.problem_url}" target="_blank" class="challenge-name">${t.problem_name} ↗</a>`
                : `<span class="challenge-name">${t.problem_name}</span>`}
              <div class="challenge-meta">
                <span class="diff-badge diff-${(t.difficulty || "").toLowerCase()}">${t.difficulty}</span>
                ${t.topic ? `<span class="tag-pill">${t.topic}</span>` : ""}
                <span class="tag-pill overdue-pill">🔴 Overdue: ${t.due_date}</span>
                <span class="status-badge" style="background:rgba(248,113,113,.15);color:#f87171;font-size:.68rem;padding:.1rem .45rem">🔴 Overdue</span>
              </div>
              ${t.note ? `<p class="mentor-note">📝 ${t.note}</p>` : ""}
            </div>
          </div>`;
        }

        /* ── PENDING ───────────────────────────────────────────────── */
        return `<div class="challenge-item" id="mt-${t.id}">
          <div class="challenge-check">
            <button class="check-btn" onclick="completeMentor(${t.id})" title="Mark as solved">○</button>
          </div>
          <div class="challenge-body" style="flex:1">
            ${t.problem_url
              ? `<a href="${t.problem_url}" target="_blank" class="challenge-name">${t.problem_name} ↗</a>`
              : `<span class="challenge-name">${t.problem_name}</span>`}
            <div class="challenge-meta">
              <span class="diff-badge diff-${(t.difficulty || "").toLowerCase()}">${t.difficulty}</span>
              ${t.topic ? `<span class="tag-pill">${t.topic}</span>` : ""}
              ${t.due_date ? `<span class="tag-pill">Due: ${t.due_date}</span>` : ""}
              <span class="status-badge status-pending" style="font-size:.68rem;padding:.1rem .45rem">🟡 Pending</span>
            </div>
            ${t.note ? `<p class="mentor-note">📝 ${t.note}</p>` : ""}
          </div>
        </div>`;
      }).join("") : `<div class="empty-state">No assignments from your mentor.</div>`}
    </div>
  </div>

  <div class="two-col-grid">
    <div class="chart-card">
      <div class="card-header"><h3>Activity — Last 30 Days</h3><span class="card-tag">problems/day</span></div>
      <div class="chart-wrap">${(data.chart_labels && data.chart_labels.length) ? `<canvas id="actChart"></canvas>` : `<div class="empty-state">Sync to see activity.</div>`}</div>
    </div>
    <div class="chart-card">
      <div class="card-header"><h3>Top Topics</h3><span class="card-tag">by problems solved</span></div>
      <div class="chart-wrap">${(data.topic_labels && data.topic_labels.length) ? `<canvas id="topicChart"></canvas>` : `<div class="empty-state">Sync to see topics.</div>`}</div>
    </div>
  </div>

  <div class="table-card">
    <div class="card-header"><h3>Recent Problems</h3><a href="problems.html" class="card-link">View all →</a></div>
    ${(data.recent && data.recent.length) ? `
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Platform</th><th>Problem</th><th>Difficulty</th><th>Date</th></tr></thead>
        <tbody>
          ${data.recent.map((p, i) => `
          <tr>
            <td class="row-num mono">${i + 1}</td>
            <td><span class="platform-badge platform-${platformCls(p.platform)}">${p.platform}</span></td>
            <td class="problem-name">${p.problem_url ? `<a href="${p.problem_url}" target="_blank" class="problem-link">${p.problem_name} ↗</a>` : p.problem_name}</td>
            <td><span class="diff-badge diff-${(p.difficulty || "").toLowerCase()}">${p.difficulty || "—"}</span></td>
            <td class="problem-date mono">${p.solved_date}</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>` : `<div class="empty-state">No submissions yet — click <strong>Sync Now</strong>.</div>`}
  </div>`;

  // Animate stat numbers (same effect as the original inline script relied on main.js for)
  document.querySelectorAll(".stat-num[data-target]").forEach(el => {
    el.textContent = el.dataset.target;
  });

  if (data.chart_labels && data.chart_labels.length && document.getElementById("actChart")) {
    new Chart(document.getElementById("actChart"), {
      type: "bar",
      data: { labels: data.chart_labels, datasets: [{ label: "Solved", data: data.chart_data, backgroundColor: "rgba(251,191,36,.65)", borderColor: "#fbbf24", borderWidth: 1, borderRadius: 3 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { x: { ticks: { color: "#555", font: { family: "Space Mono", size: 9 } }, grid: { color: "rgba(255,255,255,.04)" } },
                  y: { ticks: { color: "#555", font: { family: "Space Mono", size: 9 } }, grid: { color: "rgba(255,255,255,.04)" }, beginAtZero: true } } }
    });
  }
  if (data.topic_labels && data.topic_labels.length && document.getElementById("topicChart")) {
    new Chart(document.getElementById("topicChart"), {
      type: "doughnut",
      data: { labels: data.topic_labels, datasets: [{ data: data.topic_data,
        backgroundColor: ["#fbbf24", "#4d9de0", "#34d399", "#f87171", "#a78bfa", "#fb923c", "#38bdf8", "#4ade80"],
        borderWidth: 2, borderColor: "#101010" }] },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: "#888", font: { family: "Space Mono", size: 10 }, boxWidth: 12 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed}` } } } }
    });
  }
}

async function completeChallenge(id) {
  const data = await apiPostJSON(`/challenge/complete/${id}`, {});
  if (data.success) { await loadDashboard(); }
}
async function completeMentor(id) {
  const data = await apiPostJSON(`/mentor/complete/${id}`, {});
  if (data.success) { await loadDashboard(); }
}

async function loadDashboard() {
  DASH = await apiGet("/dashboard");
  renderDashboard();
}

(async () => {
  const me = await requireAuth({ verified: true });
  if (!me) return;
  await loadDashboard();
})();
</script>
