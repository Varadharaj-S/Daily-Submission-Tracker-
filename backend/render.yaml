################################################################################
# render.yaml — DSA Tracker deployment config
#
# Deploy steps:
#   1. Push this repo to GitHub.
#   2. Go to dashboard.render.com → New → Blueprint → connect your repo.
#   3. Render reads this file and creates the web service + cron job + DB.
#   4. Set the environment variables marked (sync manually in Render dashboard).
#
# Vercel-side config (NOT declared here — set manually in the Vercel project's
# Environment Variables panel):
#   WORKER_BACKEND_URL   = this Render web service's public URL
#                           (e.g. https://dsa-tracker.onrender.com)
#   INTERNAL_TASK_SECRET = same value as INTERNAL_TASK_SECRET below
# Without both of those set on Vercel, /import_lc and the cron delegation
# routes fall back to running the job in the Vercel serverless request
# itself, which is what caused the original 504s — see routes/sync.py.
################################################################################

services:

  # ── Web Service (Flask app) ─────────────────────────────────────────────────
  - type: web
    name: dsa-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT --timeout 120
    plan: free            # change to "starter" for always-on
    autoDeploy: true      # redeploy on every git push

    envVars:
      - key: SECRET_KEY
        generateValue: true            # Render auto-generates a secure random value

      - key: DATABASE_URL
        fromDatabase:
          name: dsa-tracker-db
          property: connectionString   # injected automatically from the DB below

      - key: GOOGLE_SERVICE_JSON
        sync: false                    # paste the full JSON string in Render dashboard

      - key: SMTP_HOST
        value: smtp.gmail.com

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_USER
        sync: false                    # your Gmail address

      - key: SMTP_PASS
        sync: false                    # Gmail App Password (not your real password)

      - key: FROM_EMAIL
        sync: false                    # sender address, usually same as SMTP_USER

      - key: APP_URL
        sync: false                    # e.g. https://dsa-tracker.onrender.com — used by
                                        # services/email_service.py for verification-link URLs only

      - key: INTERNAL_TASK_SECRET
        sync: false                    # shared secret verifying calls from the Vercel deployment
                                        # to /internal/* routes (routes/internal.py). Must match the
                                        # same value set in the Vercel project's INTERNAL_TASK_SECRET.
                                        # WORKER_BACKEND_URL is NOT set here — this service IS the
                                        # worker, so routes/sync.py + routes/cron.py fall back to
                                        # running jobs in-process, which is what we want on Render.

  # ── Cron Job (daily sync) ───────────────────────────────────────────────────
  - type: cron
    name: dsa-tracker-daily-sync
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 2 * * *"            # runs at 02:00 UTC every day
    startCommand: python scheduler.py
    plan: free

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dsa-tracker-db
          property: connectionString

      - key: GOOGLE_SERVICE_JSON
        sync: false

  # ── Cron Job (contest sync, every 5 min) ────────────────────────────────────
  # contest_scheduler.py's own docstring already assumed this existed — it
  # didn't. Without it, contest_sync.run_due_contests() only ever ran when an
  # admin clicked "Sync Now" by hand; nothing triggered it automatically.
  - type: cron
    name: dsa-tracker-contest-sync
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "*/5 * * * *"          # runs every 5 minutes
    startCommand: python contest_scheduler.py
    plan: free

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dsa-tracker-db
          property: connectionString

      - key: GOOGLE_SERVICE_JSON
        sync: false

# ── PostgreSQL Database ─────────────────────────────────────────────────────
databases:
  - name: dsa-tracker-db
    plan: free                        # 1 GB free tier on Render
    databaseName: dsa_tracker
    user: dsa_user
